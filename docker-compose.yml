version: '3.8'

services:
  statuslist-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Basic configuration
      API_KEY: "local-dev-key" # X-API-Key
      SERVICE_URL: "http://localhost:8080/api"
      # SWAGGER_URL_PREFIX: "/api"  # Only set this in production when behind a proxy that strips /api prefix
      COUNTRY_CODE: "LV"
      BASE_PATH: "/api"
      
      # Service Mode: "public" (read-only, no Swagger) or "internal" (full API + Swagger)
      # For production, run separate instances with different SERVICE_MODE values
      SERVICE_MODE: "internal"  # Change to "public" for internet-facing read-only instances
    
      # Directory paths (using container paths)
      STATUS_LIST_DIR: "/var/opt/status_lists"
      BACKUP_DIR: "/var/opt/status_list_backup"
      LOG_DIR: "/tmp/status_lists"

      # Certificate paths (mounted from host)
      PRIVATE_KEY_PATH: "/app/certs/private_key/private-key.pem" # generated key for tests - use secrets in production
      CERTIFICATE_PATH: "/app/certs/certificate/certificate.pem" # generated selfsigned certificate for tests - use secrets in production

      # Allowed doctypes (comma-separated, optional - will use defaults if not set)
      ALLOWED_DOCTYPES: "eu.europa.ec.eudi.pid.1,org.iso.18013.5.1.mDL,custom.doctype.1"

      # Storage Backend Configuration

      STATUS_LIST_STORAGE: "s3"
      S3_BUCKET: "status-lists"
      S3_ENDPOINT: "http://minio:9000"  # Use MinIO service name for inter-container communication
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"

    volumes:
      # Mount certificate directory from host for testing, no need in production (use secrets for production)
      - ./temp:/app/certs
      
      # Persistent volumes for data
      - status_lists_data:/var/opt/status_lists
      - backup_data:/var/opt/status_list_backup
      - log_data:/tmp/status_lists

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/server", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization service
  # This creates the required bucket when MinIO starts
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/status-lists --ignore-existing;
      mc anonymous set download myminio/status-lists;
      echo 'MinIO bucket status-lists created successfully';
      exit 0;
      "

volumes:
  status_lists_data:
    driver: local
  backup_data:
    driver: local
  log_data:
    driver: local
  minio_data:
    driver: local

