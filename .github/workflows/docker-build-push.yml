name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: status-list-go

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonarqube:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Generate test certificates
        run: |
          mkdir -p temp/certificate temp/private_key
          
          # Generate unencrypted ECDSA private key (P-256, as used in the code)
          openssl ecparam -name prime256v1 -genkey -noout -out temp/private_key/private-key.pem
          
          # Generate self-signed certificate (PEM format)
          openssl req -new -x509 -key temp/private_key/private-key.pem -out temp/certificate/certificate.pem -days 365 -subj "/C=LV/O=Test/CN=status-list-test"
          
          # Convert certificate to DER format (as expected by some tests, e.g., PID-DS-0002.cert.der)
          openssl x509 -in temp/certificate/certificate.pem -outform der -out temp/certificate/PID-DS-0002.cert.der
          
          # Create missing test files expected by some tests
          cp temp/private_key/private-key.pem /tmp/test.key
          cp temp/certificate/certificate.pem /tmp/test.cert
          
          # Create directories required by config tests
          sudo mkdir -p /var/opt/status_lists /var/opt/status_list_backup /var/status_lists /tmp/status_lists
          sudo chmod 755 /var/opt/status_lists /var/opt/status_list_backup /var/status_lists /tmp/status_lists

      - name: Run tests with coverage
        run: go test -timeout=2m -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

